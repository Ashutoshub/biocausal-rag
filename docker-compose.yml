services:
  neo4j:
    image: neo4j:5.18-community
    container_name: biocausal_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: biocausal_qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage